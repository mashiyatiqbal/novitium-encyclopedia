<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set a New Password — The Energy Glossary</title>
  <link rel="icon" href="assets/novitium-mark.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <h1>Set a New Password</h1>
      <p class="auth-sub" id="auth-sub">Checking your reset link…</p>

      <div class="auth-message" id="auth-message" hidden></div>

      <form id="reset-form" novalidate hidden>
        <div class="auth-field">
          <label for="password">New password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" required />
        </div>

        <div class="auth-field">
          <label for="confirm">Confirm new password</label>
          <input id="confirm" name="confirm" type="password" autocomplete="new-password" required />
        </div>

        <button class="auth-submit" type="submit" id="reset-submit">Update Password</button>
      </form>

      <p class="auth-alt" id="alt-link" hidden>
        <a href="forgot-password.html">Request a new reset link</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="auth.js"></script>
  <script>
    (function () {
      var sb      = window.NovitiumAuth.client;
      var form    = document.getElementById("reset-form");
      var sub     = document.getElementById("auth-sub");
      var msgBox  = document.getElementById("auth-message");
      var submit  = document.getElementById("reset-submit");
      var pwEl    = document.getElementById("password");
      var confEl  = document.getElementById("confirm");
      var altLink = document.getElementById("alt-link");

      var ready = false;

      function showMessage(text, type) {
        msgBox.textContent = text;
        msgBox.className = "auth-message " + type;
        msgBox.hidden = false;
      }

      function openForm() {
        if (ready) return;
        ready = true;
        sub.textContent = "Choose a new password for your account. Minimum 8 characters.";
        form.hidden = false;
      }

      function fail(text) {
        if (ready) return;
        sub.textContent = "We couldn't verify this link.";
        showMessage(text, "error");
        altLink.hidden = false;
      }

      /* Register the listener first — depending on the link format, supabase-js
         may establish the recovery session before our checks below finish. */
      sb.auth.onAuthStateChange(function (event, session) {
        if (event === "PASSWORD_RECOVERY" || (event === "SIGNED_IN" && session)) {
          openForm();
        }
      });

      (async function init() {
        var hash  = new URLSearchParams(location.hash.slice(1));
        var query = new URLSearchParams(location.search);

        // Supabase reports expired or already-used links this way.
        var errDesc = hash.get("error_description") || query.get("error_description");
        if (errDesc) {
          fail(decodeURIComponent(errDesc.replace(/\+/g, " ")));
          return;
        }

        // PKCE-style links carry ?code=. Harmless if the client already used it.
        var code = query.get("code");
        if (code) {
          try { await sb.auth.exchangeCodeForSession(code); } catch (e) { /* already exchanged */ }
        }

        // Give automatic URL detection a moment to land, then confirm.
        await new Promise(function (r) { setTimeout(r, 500); });

        var res = await sb.auth.getSession();
        if (res && res.data && res.data.session) {
          openForm();
        } else {
          fail("This reset link is invalid or has expired. Reset links are single-use and time-limited.");
        }
      })();

      form.addEventListener("submit", async function (e) {
        e.preventDefault();

        var pw   = pwEl.value;
        var conf = confEl.value;

        if (pw.length < 8) {
          showMessage("Password must be at least 8 characters.", "error");
          return;
        }
        if (pw !== conf) {
          showMessage("Those passwords don't match.", "error");
          return;
        }

        submit.disabled = true;
        submit.textContent = "Updating…";

        try {
          var result = await sb.auth.updateUser({ password: pw });

          if (result.error) {
            showMessage(result.error.message || "Couldn't update your password. Please try again.", "error");
            submit.disabled = false;
            submit.textContent = "Update Password";
            return;
          }

          form.hidden = true;
          sub.textContent = "";
          showMessage("Password updated. Taking you to the library…", "success");
          setTimeout(function () { window.location.href = "index.html"; }, 1600);
        } catch (err) {
          showMessage("Something went wrong. Please try again.", "error");
          submit.disabled = false;
          submit.textContent = "Update Password";
        }
      });
    })();
  </script>
</body>
</html>
