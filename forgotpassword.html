<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — The Energy Glossary</title>
  <link rel="icon" href="assets/novitium-mark.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <h1>Reset Your Password</h1>
      <p class="auth-sub">Enter the email address you signed up with and we'll send you a link to set a new password.</p>

      <div class="auth-message" id="auth-message" hidden></div>

      <form id="forgot-form" novalidate>
        <div class="auth-field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
        </div>

        <button class="auth-submit" type="submit" id="forgot-submit">Send Reset Link</button>
      </form>

      <p class="auth-alt">Remembered it? <a href="login.html">Log in</a></p>
      <p class="auth-alt">Need an account? <a href="signup.html">Sign up</a></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="auth.js"></script>
  <script>
    (function () {
      var form   = document.getElementById("forgot-form");
      var msgBox = document.getElementById("auth-message");
      var submit = document.getElementById("forgot-submit");
      var email  = document.getElementById("email");

      function showMessage(text, type) {
        msgBox.textContent = text;
        msgBox.className = "auth-message " + type;
        msgBox.hidden = false;
      }

      form.addEventListener("submit", async function (e) {
        e.preventDefault();

        var address = email.value.trim();
        if (!address || address.indexOf("@") === -1) {
          showMessage("Please enter the email address you signed up with.", "error");
          return;
        }

        submit.disabled = true;
        submit.textContent = "Sending…";

        try {
          var sb = window.NovitiumAuth.client;

          var result = await sb.auth.resetPasswordForEmail(address, {
            redirectTo: "https://mashiyatiqbal.github.io/novitium-encyclopedia/reset-password.html"
          });

          /* Deliberately identical wording whether or not the address has an
             account. Saying "no account found" would let anyone use this form
             to discover who is registered. */
          if (result.error && /rate|limit|too many/i.test(result.error.message || "")) {
            showMessage(
              "Too many reset requests right now. Please wait a few minutes and try again.",
              "error"
            );
          } else {
            showMessage(
              "If an account exists for " + address + ", a reset link is on its way. " +
              "Check your inbox — and your spam folder.",
              "success"
            );
            form.reset();
          }
        } catch (err) {
          showMessage("Something went wrong. Please try again.", "error");
        } finally {
          submit.disabled = false;
          submit.textContent = "Send Reset Link";
        }
      });
    })();
  </script>
</body>
</html>
